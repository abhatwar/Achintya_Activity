name: Deploy Backend to WSL using Docker

on:
  push:
    branches: ["api/dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Build backend Docker image ---
      - name: Build backend Docker image
        run: docker build -t backend-app ./backend

      # --- Save to TAR ---
      - name: Save backend image to tar
        run: docker save backend-app -o backend-app.tar

      # --- Upload to WSL ---
      - name: Upload backend image to WSL
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USER }}
          password: ${{ secrets.WSL_PASSWORD }}
          source: "backend-app.tar"
          target: "/home/${{ secrets.WSL_USER }}/backend-app.tar"

      # --- Deploy inside WSL ---
      - name: Start backend container in WSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USER }}
          password: ${{ secrets.WSL_PASSWORD }}
          script: |
            echo "💿 Loading backend Docker Image..."
            docker load -i backend-app.tar

            echo "🛑 Stopping old backend container..."
            docker stop backend-container || true

            echo "🗑️ Removing old backend container..."
            docker rm backend-container || true

            echo "🚀 Starting backend container..."
            docker run -d \
                     -p 5000:5000 \
                     --name backend-container \
                       backend-app

            echo "🎉 Backend deployed successfully!"

