name: Deploy React App to WSL using Docker

on:
  push:
    branches: ["web/dev"]   # Runs only when PR merges into this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Build Docker Image ----
      - name: Build Docker image
        run: docker build -t react-app ./frontend

      # ---- Save image to TAR so SCP can upload it ----
      - name: Save Docker image as tar
        run: docker save react-app -o react-app.tar

      # ---- Upload TAR to WSL machine ----
      - name: Upload Docker image to WSL
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USER }}
          password: ${{ secrets.WSL_PASSWORD }}
          source: "react-app.tar"
          target: "/home/${{ secrets.WSL_USER }}/react-app.tar"

      # ---- Load Docker image + restart container inside WSL ----
      - name: Load and restart Docker container in WSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USER }}
          password: ${{ secrets.WSL_PASSWORD }}
          script: |
            echo "💿 Loading Docker Image..."
            docker load -i react-app.tar

            echo "🛑 Stopping old container (if exists)..."
            docker stop react-app-container || true

            echo "🗑️ Removing old container (if exists)..."
            docker rm react-app-container || true

            echo "🚀 Starting new container..."
            docker run -d -p 8080:80 --name react-app-container react-app

            echo "🎉 Deployment complete!"
